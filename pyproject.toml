[project]
name = "crossfade"
version = "0.0.1"
description = "Capability-aware evidence and experiment platform for wave-propagation inference"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "xarray", "zarr", "pint", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
crossfade = "crossfade.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crossfade*", "packs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
